name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip' # 激活依赖缓存，加快运行速度

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e .
          uv pip install --system ruff black==24.10.0 isort

      - name: Run Ruff linter
        run: ruff check app/

      - name: Check code formatting
        run: black --check app/ --target-version py312

      - name: Check imports
        run: isort --check-only app/ --line-length 88

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e .[test] # 建议在 pyproject.toml 配置 test 依赖组

      - name: Run unit tests
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379/0
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_DATABASE: test_chatmooc
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MILVUS_HOST: localhost
          MILVUS_PORT: 19530
        run: |
          # 移除了 || true，确保单元测试失败时能阻断流水线
          pytest tests/ -m unit -v --ignore=tests/test_integration

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_chatmooc
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      milvus:
        image: milvusdb/milvus:v2.4.0
        ports:
          - 19530:19530
          - 9091:9091

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e .[test]
          sudo apt-get update && sudo apt-get install -y mysql-client netcat-traditional

      - name: Wait for MySQL and RabbitMQ
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if mysqladmin ping -h "127.0.0.1" -uroot -proot --silent; then
              echo "MySQL is ready!"
              break
            fi
            sleep 2
          done
          
          echo "Waiting for RabbitMQ..."
          for i in {1..30}; do
            if nc -z localhost 5672; then
              echo "RabbitMQ is ready!"
              break
            fi
            sleep 2
          done

      - name: Run integration tests
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: amqp://guest:guest@localhost:5672//
          MYSQL_HOST: 127.0.0.1 # 这里从 localhost 改为了 127.0.0.1 避免 socket 连接问题
          MYSQL_PORT: 3306
          MYSQL_DATABASE: test_chatmooc
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MILVUS_HOST: localhost
          MILVUS_PORT: 19530
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || 'dummy-key-for-ci' }}
        run: |
          # 移除了 || true，真正的 CI 必须对失败零容忍
          pytest tests/ -m integration -v

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test-unit, test-integration]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Print summary
        run: |
          echo "## Test Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ${{ needs.lint.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Unit Tests: ${{ needs.test-unit.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration Tests: ${{ needs.test-integration.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY